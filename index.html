<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игровой магазин</title>

<style>
*{box-sizing:border-box}

:root{
  --accent:#3478f6;
  --bg:#f4f6f9;
  --text:#202633;
  --card:#ffffff;
  --radius:15px;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

button,input,textarea,select{
  font-family:inherit;
}

.header{
  position:sticky;
  top:0;
  z-index:5;
  background:#fff;
  border-bottom:1px solid #e5e8ee;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:21px;
  font-weight:900;
  color:#2580c8;
  cursor:pointer;
  user-select:none;
}

.logo span{
  color:#333;
}

.cart{
  border:0;
  background:var(--accent);
  color:#fff;
  border-radius:11px;
  padding:10px 14px;
  font-weight:800;
  cursor:pointer;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:18px 14px 50px;
}

.hero{
  background:linear-gradient(135deg,#172033,#2c3c60);
  color:white;
  border-radius:20px;
  padding:25px;
  margin-bottom:18px;
}

.hero h1{
  margin:0 0 7px;
  font-size:34px;
}

.hero p{
  margin:0;
  color:#d4dceb;
}

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:20px;
}

.tab{
  white-space:nowrap;
  border:1px solid #e2e6ed;
  background:#fff;
  border-radius:11px;
  padding:10px 14px;
  font-weight:700;
  color:#626c7f;
  cursor:pointer;
}

.tab.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

.section{
  margin:25px 0;
}

.title{
  font-size:23px;
  font-weight:900;
  margin:0 0 12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:11px;
}

.card{
  background:var(--card);
  border:1px solid #e3e7ed;
  border-radius:var(--radius);
  padding:15px;
  display:flex;
  flex-direction:column;
  min-height:175px;
}

.icon{
  font-size:27px;
  margin-bottom:10px;
}

.card h3{
  font-size:15px;
  line-height:1.25;
  margin:0 0 5px;
}

.desc{
  font-size:12px;
  color:#7c8595;
  margin-top:auto;
}

.price{
  font-size:20px;
  font-weight:900;
  margin:12px 0 9px;
}

.buy{
  border:0;
  border-radius:10px;
  padding:10px;
  background:var(--accent);
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  background:#0009;
  backdrop-filter:blur(5px);
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.show{
  display:flex;
}

.box{
  width:min(430px,100%);
  background:#fff;
  border-radius:20px;
  padding:23px;
  box-shadow:0 25px 70px #0008;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.close{
  border:0;
  background:#eef1f5;
  border-radius:9px;
  width:36px;
  height:36px;
  font-size:20px;
  cursor:pointer;
}

.box h2{
  margin:0 0 5px;
}

.selected{
  font-size:13px;
  color:#778196;
  margin-bottom:18px;
}

.field{
  margin:11px 0;
}

.field label{
  display:block;
  font-size:11px;
  font-weight:800;
  color:#697387;
  margin-bottom:5px;
  text-transform:uppercase;
}

.field input{
  width:100%;
  padding:13px;
  border:1px solid #dce1e9;
  border-radius:10px;
  outline:none;
  font-size:15px;
}

.submit,.ok{
  width:100%;
  border:0;
  border-radius:11px;
  padding:13px;
  background:#ff713b;
  color:#fff;
  font-weight:900;
  margin-top:8px;
  cursor:pointer;
}

.success{
  text-align:center;
  padding:8px;
}

.check{
  width:65px;
  height:65px;
  margin:0 auto 14px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#e8faef;
  color:#22ad70;
  font-size:34px;
  font-weight:900;
}

.success p{
  color:#778196;
  line-height:1.5;
}

.ok{
  background:var(--accent);
}

.admin-list{
  margin-top:12px;
  max-height:55vh;
  overflow:auto;
}

.order-item{
  border:1px solid #e2e6ed;
  border-radius:12px;
  padding:12px;
  margin:9px 0;
  background:#f8fafc;
}

.order-item strong{
  display:block;
  font-size:14px;
  margin-bottom:5px;
}

.order-item span{
  display:block;
  font-size:12px;
  color:#687386;
  margin:3px 0;
}

.empty-orders{
  text-align:center;
  color:#7c8595;
  padding:25px 10px;
}

.admin-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.admin-actions button{
  flex:1;
  border:0;
  border-radius:10px;
  padding:11px;
  font-weight:800;
  cursor:pointer;
  background:#eef1f5;
}

.admin-actions .danger{
  background:#ffe9e9;
  color:#c33;
}

/* =========================
   КОНСТРУКТОР
========================= */

#editor{
  display:none;
  position:fixed;
  inset:0;
  z-index:1000;
  background:#eef1f5;
}

#editor.show{
  display:flex;
}

.editor-sidebar{
  width:250px;
  background:#171b24;
  color:white;
  padding:18px;
  overflow:auto;
  flex-shrink:0;
}

.editor-sidebar h2{
  margin:0 0 5px;
  font-size:20px;
}

.editor-sidebar .sub{
  color:#8992a5;
  font-size:12px;
  margin-bottom:20px;
}

.tool-title{
  font-size:11px;
  color:#858fa3;
  font-weight:800;
  text-transform:uppercase;
  margin:20px 0 8px;
}

.tool{
  width:100%;
  border:0;
  border-radius:9px;
  background:#252b38;
  color:white;
  padding:11px;
  text-align:left;
  margin-bottom:7px;
  cursor:pointer;
}

.tool:hover{
  background:#303848;
}

.editor-center{
  flex:1;
  min-width:0;
  overflow:auto;
  padding:25px;
}

.editor-page{
  max-width:900px;
  min-height:100%;
  margin:auto;
  background:white;
  box-shadow:0 10px 40px #0002;
  padding:18px;
}

.editor-page .editor-element{
  position:relative;
  border:2px dashed transparent;
  transition:.15s;
}

.editor-page .editor-element:hover{
  border-color:#3478f6;
}

.editor-page .editor-element.selected{
  border:2px solid #3478f6;
}

.drag-handle{
  position:absolute;
  left:5px;
  top:5px;
  z-index:20;
  background:#3478f6;
  color:white;
  border-radius:6px;
  padding:4px 7px;
  font-size:11px;
  cursor:grab;
  opacity:0;
}

.editor-element:hover .drag-handle,
.editor-element.selected .drag-handle{
  opacity:1;
}

.custom-block{
  padding:30px;
  text-align:center;
  border:2px dashed #d9deea;
  border-radius:14px;
  margin:12px 0;
  color:#667085;
}

.editor-right{
  width:290px;
  background:#fff;
  border-left:1px solid #dfe3ea;
  padding:18px;
  overflow:auto;
  flex-shrink:0;
}

.editor-right h3{
  margin:0 0 18px;
}

.property{
  margin-bottom:15px;
}

.property label{
  display:block;
  font-size:11px;
  font-weight:800;
  color:#697387;
  margin-bottom:6px;
  text-transform:uppercase;
}

.property input,
.property textarea,
.property select{
  width:100%;
  border:1px solid #dce1e9;
  border-radius:8px;
  padding:9px;
  outline:none;
  background:white;
}

.property textarea{
  min-height:80px;
  resize:vertical;
}

.color-row{
  display:flex;
  gap:7px;
}

.color-row input[type=color]{
  width:45px;
  height:38px;
  padding:2px;
}

.editor-top{
  position:fixed;
  top:0;
  left:250px;
  right:290px;
  height:60px;
  background:white;
  border-bottom:1px solid #dfe3ea;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.editor-top button{
  border:0;
  border-radius:9px;
  padding:9px 14px;
  font-weight:800;
  cursor:pointer;
}

.save-design{
  background:#3478f6;
  color:white;
}

.exit-editor{
  background:#eef1f5;
}

.editor-center{
  padding-top:85px;
}

.delete-element{
  width:100%;
  border:0;
  border-radius:9px;
  padding:11px;
  background:#ffe9e9;
  color:#c33;
  font-weight:800;
  cursor:pointer;
}

@media(max-width:900px){
  .editor-sidebar{width:190px}
  .editor-right{width:240px}
  .editor-top{left:190px;right:240px}
  .grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:650px){
  .editor-sidebar{display:none}
  .editor-right{width:240px}
  .editor-top{left:0;right:240px}
}

@media(max-width:480px){
  .hero h1{font-size:27px}
  .grid{gap:8px}
  .card{padding:12px;min-height:165px}
  .card h3{font-size:14px}
  .price{font-size:18px}
}
</style>
</head>

<body>

<header class="header">
  <div class="logo" id="adminLogo">BOT<span>-T</span></div>
  <button class="cart" id="cart">🛒 Заказ</button>
</header>

<main class="wrap">

<section class="hero editor-element" data-editor-id="hero">
  <div class="drag-handle">↕ Перетащить</div>
  <h1>Игровой магазин</h1>
  <p>Выберите игру и товар — оформите заказ за несколько секунд.</p>
</section>

<div class="tabs editor-element" id="tabs" data-editor-id="tabs">
  <div class="drag-handle">↕ Перетащить</div>
</div>

<div id="catalog" class="editor-element" data-editor-id="catalog">
  <div class="drag-handle">↕ Перетащить</div>
</div>

<div id="customBlocks"></div>

</main>

<!-- Заказ -->

<div class="modal" id="modal">
  <div class="box" id="box"></div>
</div>

<!-- Админка -->

<div class="modal" id="adminModal">

<div class="box">

<div class="top">

<div>
<h2>📋 Заявки</h2>
<div class="selected">Список заказов на этом устройстве</div>
</div>

<button class="close" id="adminClose">×</button>

</div>

<div id="ordersList" class="admin-list"></div>

<div class="admin-actions">
<button id="refreshOrders">Обновить</button>
<button class="danger" id="clearOrders">Очистить</button>
</div>

</div>

</div>

<!-- =========================
     КОНСТРУКТОР
========================= -->

<div id="editor">

<div class="editor-sidebar">

<h2>🎨 BOT-T</h2>
<div class="sub">Конструктор сайта</div>

<div class="tool-title">Добавить блок</div>

<button class="tool" onclick="addBlock('text')">
📝 Текст
</button>

<button class="tool" onclick="addBlock('title')">
🔤 Заголовок
</button>

<button class="tool" onclick="addBlock('button')">
🔘 Кнопка
</button>

<button class="tool" onclick="addBlock('image')">
🖼️ Изображение
</button>

<button class="tool" onclick="addBlock('space')">
↕️ Отступ
</button>

<div class="tool-title">Страница</div>

<button class="tool" onclick="selectEditorElement('hero')">
🏠 Главный экран
</button>

<button class="tool" onclick="selectEditorElement('tabs')">
🎮 Категории
</button>

<button class="tool" onclick="selectEditorElement('catalog')">
🛒 Товары
</button>

</div>


<div class="editor-center">

<div class="editor-top">

<button class="save-design" onclick="saveDesign()">
💾 Сохранить
</button>

<button class="exit-editor" onclick="closeEditor()">
Выйти
</button>

</div>


<div class="editor-page" id="editorPage">

<div id="editorHero"></div>
<div id="editorTabs"></div>
<div id="editorCatalog"></div>
<div id="editorCustom"></div>

</div>

</div>


<div class="editor-right">

<h3>⚙️ Настройки</h3>

<div id="properties">

<div style="color:#7c8595;font-size:13px">
Выберите элемент на странице.
</div>

</div>

</div>

</div>


<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

/* =========================
   ТОВАРЫ
========================= */

const data = [

{
g:"Brawl Stars",
i:"⭐",
p:[
["Brawl Pass",649],
["Brawl Pass Plus",899],
["Brawl Pass (особая акция)",349],
["Улучшение до Brawl Pass Plus",449],
["30 гемов",229],
["80 гемов",499],
["170 гемов",949],
["360 гемов",1749],
["950 гемов",4199],
["2000 гемов",7999],
["Ранний доступ Луми",2049],
["5000 блингoв",249],
["10000 блингoв",519],
["Pro Pass",2099]
]
},

{
g:"Clash Royale",
i:"👑",
p:[
["80 гемов",149],
["500 гемов",549],
["1200 гемов",1090],
["2500 гемов",2049],
["6500 гемов",4799],
["14000 гемов",9799],
["Алмазный пропуск",1249]
]
},

{
g:"PUBG Mobile",
i:"🎮",
p:[
["60 UC",110],
["120 UC",220],
["180 UC",300],
["325 UC",470],
["385 UC",565],
["660 UC",870],
["720 UC",965],
["985 UC",1340],
["1045 UC",1435],
["1320 UC",1740],
["1800 UC",2300],
["1920 UC",2480],
["3850 UC",4450],
["8100 UC",8500],
["16200 UC",17000],
["32400 UC",34000]
]
}

];

let filter="Все";
let selected=null;


/* =========================
   КАТАЛОГ
========================= */

const tabs=document.getElementById("tabs");
const cat=document.getElementById("catalog");
const modal=document.getElementById("modal");

const money=x =>
x==null
? "Цена уточняется"
: x.toLocaleString("ru-RU")+" ₽";


function render(){

tabs.innerHTML=
`
<div class="drag-handle">↕ Перетащить</div>
`
+
["Все",...data.map(x=>x.g)]
.map(x=>`
<button
class="tab ${x==filter?"active":""}"
onclick='setFilter(${JSON.stringify(x)})'
>
${x}
</button>
`)
.join("");


const arr=
filter=="Все"
?data
:data.filter(x=>x.g==filter);


cat.innerHTML=
`
<div class="drag-handle">↕ Перетащить</div>
`
+
arr.map(x=>`

<section class="section">

<h2 class="title">
${x.i} ${x.g}
</h2>

<div class="grid">

${x.p.map(p=>`

<article class="card">

<div class="icon">${x.i}</div>

<h3>${p[0]}</h3>

<div class="desc">
Моментальное оформление
</div>

<div class="price">
${money(p[1])}
</div>

<button
class="buy"
onclick='order(${JSON.stringify(x.g)},${JSON.stringify(p[0])},${p[1]===null?"null":p[1]})'
>
Заказать
</button>

</article>

`).join("")}

</div>

</section>

`).join("");

}


/* =========================
   ФИЛЬТР
========================= */

function setFilter(x){

filter=x;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
   ЗАКАЗ
========================= */

function order(g,p,price){

selected={g,p,price};

modal.classList.add("show");

document.getElementById("box").innerHTML=`

<div class="top">

<div>

<h2>Оформление заказа</h2>

<div class="selected">
${g} • ${p} • ${money(price)}
</div>

</div>

<button
class="close"
onclick="closeModal()"
>
×
</button>

</div>

<form id="form">

<div class="field">

<label>Ваше имя</label>

<input
id="name"
required
placeholder="Иван"
>

</div>

<div class="field">

<label>Telegram</label>

<input
id="tg"
required
placeholder="@username"
>

</div>

<button
class="submit"
type="submit"
>
Оформить заказ
</button>

</form>

`;

document.getElementById("form").onsubmit=submitOrder;

setTimeout(()=>{

const nameInput=document.getElementById("name");

if(nameInput){
nameInput.focus();
}

},50);

}


/* =========================
   ОТПРАВКА TELEGRAM
========================= */

async function submitOrder(e){

e.preventDefault();

const name=
document.getElementById("name").value.trim();

const tg=
document.getElementById("tg").value.trim();

if(!name||!tg){

alert("Заполните все поля.");

return;

}


const o={

id:Date.now(),

date:new Date().toLocaleString("ru-RU"),

game:selected.g,

product:selected.p,

price:selected.price,

name,

telegram:tg

};


const submitButton=
document.querySelector(".submit");

if(submitButton){

submitButton.disabled=true;
submitButton.textContent="Отправка...";

}


try{

const response=await fetch("/api/order",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(o)

});


let result;

try{

result=await response.json();

}catch(error){

result={
ok:false,
error:"Сервер вернул неправильный ответ"
};

}


if(!response.ok||!result.ok){

alert(
"Не удалось отправить заказ.\n\n"+
(result.error||"Неизвестная ошибка")+
(result.detail?"\n\n"+result.detail:"")
);

if(submitButton){

submitButton.disabled=false;
submitButton.textContent="Оформить заказ";

}

return;

}


const orders=
JSON.parse(
localStorage.getItem("shop_orders")||"[]"
);

orders.unshift(o);

localStorage.setItem(
"shop_orders",
JSON.stringify(orders)
);


document.getElementById("box").innerHTML=`

<div class="success">

<div class="check">✓</div>

<h2>Заказ оформлен!</h2>

<p>
Наш менеджер скоро свяжется с вами.
</p>

<button
class="ok"
onclick="closeModal()"
>
Готово
</button>

</div>

`;


if(
window.Telegram&&
Telegram.WebApp
){

try{

if(Telegram.WebApp.HapticFeedback){

Telegram.WebApp.HapticFeedback
.notificationOccurred("success");

}

}catch(err){}

}


}catch(error){

console.error(error);

alert(
"Не удалось отправить заказ.\n\n"+
"Проверьте подключение и попробуйте ещё раз."
);

if(submitButton){

submitButton.disabled=false;
submitButton.textContent="Оформить заказ";

}

}

}


function closeModal(){

modal.classList.remove("show");

}


modal.onclick=e=>{

if(e.target===modal){

closeModal();

}

};


document.getElementById("cart").onclick=()=>{

if(selected){

order(
selected.g,
selected.p,
selected.price
);

}else{

document.querySelector(".buy")?.click();

}

};


/* =========================
   АДМИНКА
========================= */

function esc(v){

return String(v)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function showOrders(){

const a=
JSON.parse(
localStorage.getItem("shop_orders")||"[]"
);

const l=
document.getElementById("ordersList");


l.innerHTML=a.length

?a.map(o=>`

<div class="order-item">

<strong>
${esc(o.game)} — ${esc(o.product)}
</strong>

<span>💰 ${money(o.price)}</span>
<span>👤 ${esc(o.name)}</span>
<span>💬 ${esc(o.telegram)}</span>
<span>🕒 ${esc(o.date)}</span>

</div>

`).join("")

:`

<div class="empty-orders">
Заявок пока нет.
</div>

`;

document
.getElementById("adminModal")
.classList.add("show");

}


let clicks=0;
let timer;


document.getElementById("adminLogo").onclick=()=>{

clicks++;

clearTimeout(timer);

if(clicks>=5){

clicks=0;

showOrders();

}else{

timer=setTimeout(
()=>clicks=0,
1200
);

}

};


document.getElementById("adminClose").onclick=()=>{

document
.getElementById("adminModal")
.classList
.remove("show");

};


document.getElementById("refreshOrders").onclick=
showOrders;


document.getElementById("clearOrders").onclick=()=>{

if(confirm("Удалить все заявки на этом устройстве?")){

localStorage.removeItem("shop_orders");

showOrders();

}

};


document.getElementById("adminModal").onclick=e=>{

if(e.target.id==="adminModal"){

e.currentTarget.classList.remove("show");

}

};


/* =========================
   КОНСТРУКТОР
========================= */

let editorSelected=null;

let design=
JSON.parse(
localStorage.getItem("bot_t_design")||"null"
)||{
blocks:[],
styles:{
bg:"#f4f6f9",
text:"#202633",
accent:"#3478f6",
radius:"15"
}
};


function openEditor(){

document.getElementById("editor").classList.add("show");

renderEditor();

}


function closeEditor(){

document.getElementById("editor").classList.remove("show");

}


function renderEditor(){

const page=document.getElementById("editorPage");

const hero=document.querySelector(".hero").cloneNode(true);
const tab=document.querySelector(".tabs").cloneNode(true);
const catalog=document.querySelector("#catalog").cloneNode(true);

hero.removeAttribute("data-editor-id");
tab.removeAttribute("data-editor-id");
catalog.removeAttribute("data-editor-id");

document.getElementById("editorHero").innerHTML="";
document.getElementById("editorTabs").innerHTML="";
document.getElementById("editorCatalog").innerHTML="";

document.getElementById("editorHero").appendChild(hero);
document.getElementById("editorTabs").appendChild(tab);
document.getElementById("editorCatalog").appendChild(catalog);


document.getElementById("editorHero").onclick=
()=>selectEditorElement("hero");

document.getElementById("editorTabs").onclick=
e=>{
e.stopPropagation();
selectEditorElement("tabs");
};

document.getElementById("editorCatalog").onclick=
e=>{
e.stopPropagation();
selectEditorElement("catalog");
};


applyDesign();


renderCustomBlocks();

}


function selectEditorElement(id){

editorSelected=id;

document
.querySelectorAll(".editor-element")
.forEach(x=>x.classList.remove("selected"));


const props=document.getElementById("properties");


if(id==="hero"){

props.innerHTML=`

<div class="property">

<label>Заголовок</label>

<input
id="propHeroTitle"
value="${esc(document.querySelector(".hero h1").innerText)}"
oninput="updateHero()"
>

</div>

<div class="property">

<label>Описание</label>

<textarea
id="propHeroText"
oninput="updateHero()"
>${esc(document.querySelector(".hero p").innerText)}</textarea>

</div>

<div class="property">

<label>Фон</label>

<input
type="color"
id="propHeroBg"
value="#172033"
oninput="updateHeroStyle()"
>

</div>

<div class="property">

<label>Скругление</label>

<input
type="number"
id="propRadius"
value="${design.styles.radius}"
oninput="updateGlobalStyle()"
>

</div>

`;

}


else if(id==="tabs"){

props.innerHTML=`

<div class="property">

<label>Цвет кнопок</label>

<input
type="color"
value="${design.styles.accent}"
oninput="design.styles.accent=this.value;applyDesign()"
>

</div>

<div class="property">

<label>Скругление</label>

<input
type="number"
value="${design.styles.radius}"
oninput="design.styles.radius=this.value;applyDesign()"
>

</div>

<p style="font-size:12px;color:#7c8595">
Категории товаров генерируются автоматически.
</p>

`;

}


else if(id==="catalog"){

props.innerHTML=`

<div class="property">

<label>Цвет фона страницы</label>

<input
type="color"
value="${design.styles.bg}"
oninput="design.styles.bg=this.value;applyDesign()"
>

</div>

<div class="property">

<label>Цвет текста</label>

<input
type="color"
value="${design.styles.text}"
oninput="design.styles.text=this.value;applyDesign()"
>

</div>

<div class="property">

<label>Цвет кнопок</label>

<input
type="color"
value="${design.styles.accent}"
oninput="design.styles.accent=this.value;applyDesign()"
>

</div>

<div class="property">

<label>Скругление карточек</label>

<input
type="number"
value="${design.styles.radius}"
oninput="design.styles.radius=this.value;applyDesign()"
>

</div>

`;

}

}


function updateHero(){

const title=
document.getElementById("propHeroTitle").value;

const text=
document.getElementById("propHeroText").value;


const h=
document.querySelector(".hero h1");

const p=
document.querySelector(".hero p");


h.innerText=title;
p.innerText=text;

renderEditor();

selectEditorElement("hero");

}


function updateHeroStyle(){

const color=
document.getElementById("propHeroBg").value;

document.querySelector(".hero").style.background=
`linear-gradient(135deg,${color},#2c3c60)`;

}


function updateGlobalStyle(){

design.styles.radius=
document.getElementById("propRadius").value;

applyDesign();

}


function applyDesign(){

document.documentElement.style.setProperty(
"--accent",
design.styles.accent
);

document.documentElement.style.setProperty(
"--bg",
design.styles.bg
);

document.documentElement.style.setProperty(
"--text",
design.styles.text
);

document.documentElement.style.setProperty(
"--radius",
design.styles.radius+"px"
);

}


function addBlock(type){

const id=
"custom_"+Date.now();

let html="";


if(type==="text"){

html=`

<div
class="custom-block"
contenteditable="true"
>
Новый текст
</div>

`;

}


if(type==="title"){

html=`

<div
class="custom-block"
contenteditable="true"
style="font-size:28px;font-weight:900;color:#202633"
>
Новый заголовок
</div>

`;

}


if(type==="button"){

html=`

<div class="custom-block">

<button
style="
border:0;
border-radius:10px;
padding:12px 22px;
background:var(--accent);
color:white;
font-weight:800;
cursor:pointer;
"
>
Новая кнопка
</button>

</div>

`;

}


if(type==="image"){

html=`

<div class="custom-block">

<input
type="text"
placeholder="Вставьте URL картинки"
style="
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:8px;
"
onchange="
this.parentElement.querySelector('img').src=this.value
"
>

<br><br>

<img
src="https://placehold.co/600x200?text=Ваше+изображение"
style="
max-width:100%;
border-radius:12px;
"
>

</div>

`;

}


if(type==="space"){

html=`

<div
class="custom-block"
style="height:80px"
>
↕ Отступ
</div>

`;

}


design.blocks.push({
id,
type,
html
});

saveDesign();

renderCustomBlocks();

}


function renderCustomBlocks(){

const box=
document.getElementById("editorCustom");

box.innerHTML="";


design.blocks.forEach((block,index)=>{

const wrapper=
document.createElement("div");

wrapper.className=
"editor-element";

wrapper.dataset.customId=
block.id;

wrapper.innerHTML=`

<div class="drag-handle">
↕ Перетащить
</div>

${block.html}

`;

wrapper.onclick=e=>{

e.stopPropagation();

selectCustomBlock(block.id);

};


box.appendChild(wrapper);

});

}


function selectCustomBlock(id){

editorSelected=id;

const block=
design.blocks.find(x=>x.id===id);

if(!block)return;


document.getElementById("properties").innerHTML=`

<div class="property">

<label>Тип блока</label>

<input
value="${block.type}"
disabled
>

</div>

<div class="property">

<label>HTML содержимое</label>

<textarea
id="customHtml"
oninput="updateCustomHtml('${id}')"
>${esc(block.html)}</textarea>

</div>

<button
class="delete-element"
onclick="deleteCustomBlock('${id}')"
>
Удалить блок
</button>

`;

}


function updateCustomHtml(id){

const block=
design.blocks.find(x=>x.id===id);

if(!block)return;

block.html=
document.getElementById("customHtml").value;

renderCustomBlocks();

}


function deleteCustomBlock(id){

design.blocks=
design.blocks.filter(x=>x.id!==id);

editorSelected=null;

renderCustomBlocks();

document.getElementById("properties").innerHTML=`
<div style="color:#7c8595;font-size:13px">
Выберите элемент на странице.
</div>
`;

}


function saveDesign(){

localStorage.setItem(
"bot_t_design",
JSON.stringify(design)
);

applyDesign();

alert("Дизайн сохранён!");

}


function loadSavedDesign(){

const saved=
JSON.parse(
localStorage.getItem("bot_t_design")||"null"
);

if(saved){

design=saved;

applyDesign();

}

}


/* =========================
   ПЕРЕТАСКИВАНИЕ БЛОКОВ
========================= */

let dragged=null;


document.addEventListener("dragstart",e=>{

const el=
e.target.closest(".editor-element");

if(!el)return;

dragged=el;

});


document.addEventListener("dragover",e=>{

if(!dragged)return;

const target=
e.target.closest(".editor-element");

if(!target||target===dragged)return;

e.preventDefault();

const rect=
target.getBoundingClientRect();

const before=
e.clientY<rect.top+rect.height/2;

if(before){

target.parentNode.insertBefore(
dragged,
target
);

}else{

target.parentNode.insertBefore(
dragged,
target.nextSibling
);

}

});


document.addEventListener("dragend",()=>{

dragged=null;

});


function makeDraggable(){

document
.querySelectorAll("#editor .editor-element")
.forEach(el=>{

el.draggable=true;

});

}


/* =========================
   ЛОГОТИП
========================= */

let adminClicks=0;
let adminTimer;


document.getElementById("adminLogo").addEventListener(
"click",
()=>{

adminClicks++;

clearTimeout(adminTimer);


if(adminClicks>=5){

adminClicks=0;

openEditor();

}else{

adminTimer=
setTimeout(
()=>adminClicks=0,
1200
);

}

}
);


/* =========================
   ЗАПУСК
========================= */

render();

loadSavedDesign();

</script>

</body>
</html>
