<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игровой магазин</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f9;color:#202633;font-family:Arial,sans-serif}
.header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e5e8ee;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:21px;font-weight:900;color:#2580c8;cursor:pointer}
.logo span{color:#333}
.cart{border:0;background:#3478f6;color:#fff;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}
.wrap{max-width:1100px;margin:auto;padding:18px 14px 50px}
.hero{background:linear-gradient(135deg,#172033,#2c3c60);color:white;border-radius:20px;padding:25px;margin-bottom:18px}
.hero h1{margin:0 0 7px;font-size:34px}
.hero p{margin:0;color:#d4dceb}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:20px}
.tab{white-space:nowrap;border:1px solid #e2e6ed;background:#fff;border-radius:11px;padding:10px 14px;font-weight:700;color:#626c7f;cursor:pointer}
.tab.active{background:#3478f6;color:#fff;border-color:#3478f6}
.section{margin:25px 0}
.title{font-size:23px;font-weight:900;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.card{background:#fff;border:1px solid #e3e7ed;border-radius:15px;padding:15px;display:flex;flex-direction:column;min-height:175px}
.icon{font-size:27px;margin-bottom:10px}
.card h3{font-size:15px;line-height:1.25;margin:0 0 5px}
.desc{font-size:12px;color:#7c8595;margin-top:auto}
.price{font-size:20px;font-weight:900;margin:12px 0 9px}
.buy{border:0;border-radius:10px;padding:10px;background:#3478f6;color:#fff;font-weight:800;cursor:pointer}
.modal{display:none;position:fixed;inset:0;z-index:50;background:#0009;backdrop-filter:blur(5px);align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.box{width:min(430px,100%);background:#fff;border-radius:20px;padding:23px;box-shadow:0 25px 70px #0008}
.top{display:flex;justify-content:space-between;gap:15px}
.close{border:0;background:#eef1f5;border-radius:9px;width:36px;height:36px;font-size:20px;cursor:pointer}
.box h2{margin:0 0 5px}
.selected{font-size:13px;color:#778196;margin-bottom:18px}
.field{margin:11px 0}
.field label{display:block;font-size:11px;font-weight:800;color:#697387;margin-bottom:5px;text-transform:uppercase}
.field input{width:100%;padding:13px;border:1px solid #dce1e9;border-radius:10px;outline:none;font-size:15px}
.submit,.ok{width:100%;border:0;border-radius:11px;padding:13px;background:#ff713b;color:#fff;font-weight:900;margin-top:8px;cursor:pointer}
.success{text-align:center;padding:8px}
.check{width:65px;height:65px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:#e8faef;color:#22ad70;font-size:34px;font-weight:900}
.success p{color:#778196;line-height:1.5}
.ok{background:#3478f6}
.admin-list{margin-top:12px;max-height:55vh;overflow:auto}
.order-item{border:1px solid #e2e6ed;border-radius:12px;padding:12px;margin:9px 0;background:#f8fafc}
.order-item strong{display:block;font-size:14px;margin-bottom:5px}
.order-item span{display:block;font-size:12px;color:#687386;margin:3px 0}
.empty-orders{text-align:center;color:#7c8595;padding:25px 10px}
.admin-actions{display:flex;gap:8px;margin-top:15px}
.admin-actions button{flex:1;border:0;border-radius:10px;padding:11px;font-weight:800;cursor:pointer;background:#eef1f5}
.admin-actions .danger{background:#ffe9e9;color:#c33}

@media(max-width:800px){
.grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:480px){
.hero h1{font-size:27px}
.grid{gap:8px}
.card{padding:12px;min-height:165px}
.card h3{font-size:14px}
.price{font-size:18px}
}
</style>
</head>

<body>

<header class="header">
<div class="logo" id="adminLogo">BOT<span>-T</span></div>
<button class="cart" id="cart">🛒 Заказ</button>
</header>

<main class="wrap">

<section class="hero">
<h1>Игровой магазин</h1>
<p>Выберите игру и товар — оформите заказ за несколько секунд.</p>
</section>

<div class="tabs" id="tabs"></div>

<div id="catalog"></div>

</main>

<div class="modal" id="modal">
<div class="box" id="box"></div>
</div>

<div class="modal" id="adminModal">

<div class="box">

<div class="top">

<div>
<h2>📋 Заявки</h2>
<div class="selected">Список заказов на этом устройстве</div>
</div>

<button class="close" id="adminClose">×</button>

</div>

<div id="ordersList" class="admin-list"></div>

<div class="admin-actions">
<button id="refreshOrders">Обновить</button>
<button class="danger" id="clearOrders">Очистить</button>
</div>

</div>

</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

const data = [

{
g:"Brawl Stars",
i:"C:/Users/alexh/Desktop/AA26%20Shop/бс/бп/1.png",
p:[
["Brawl Pass",649],
["Brawl Pass Plus",899],
["Brawl Pass (особая акция)",349],
["Улучшение до Brawl Pass Plus",449],
["30 гемов",229],
["80 гемов",499],
["170 гемов",949],
["360 гемов",1749],
["950 гемов",4199],
["2000 гемов",7999],
["Ранний доступ Луми",2049],
["5000 блингoв",249],
["10000 блингoв",519],
["Pro Pass",2099]
]
},

{
g:"Clash Royale",
i:"C:/Users/alexh/Desktop/AA26%20Shop/бс/бп/1.png",
p:[
["80 гемов",149],
["500 гемов",549],
["1200 гемов",1090],
["2500 гемов",2049],
["6500 гемов",4799],
["14000 гемов",9799],
["Алмазный пропуск",1249]
]
},

{
g:"PUBG Mobile",
i:"C:/Users/alexh/Desktop/AA26%20Shop/бс/бп/1.png",
p:[
["60 UC",110],
["120 UC",220],
["180 UC",300],
["325 UC",470],
["385 UC",565],
["660 UC",870],
["720 UC",965],
["985 UC",1340],
["1045 UC",1435],
["1320 UC",1740],
["1800 UC",2300],
["1920 UC",2480],
["3850 UC",4450],
["8100 UC",8500],
["16200 UC",17000],
["32400 UC",34000]
]
}

];

let filter = "Все";
let selected = null;

const tabs = document.getElementById("tabs");
const cat = document.getElementById("catalog");
const modal = document.getElementById("modal");

const money = x =>
x == null
? "Цена уточняется"
: x.toLocaleString("ru-RU") + " ₽";


function render(){

tabs.innerHTML =
["Все", ...data.map(x=>x.g)]
.map(x => `
<button
class="tab ${x == filter ? "active" : ""}"
onclick='setFilter(${JSON.stringify(x)})'
>
${x}
</button>
`)
.join("");


const arr =
filter == "Все"
? data
: data.filter(x=>x.g == filter);


cat.innerHTML = arr.map(x => `

<section class="section">

<h2 class="title">
${x.i} ${x.g}
</h2>

<div class="grid">

${x.p.map(p => `

<article class="card">

<div class="icon">${x.i}</div>

<h3>${p[0]}</h3>

<div class="desc">
Моментальное оформление
</div>

<div class="price">
${money(p[1])}
</div>

<button
class="buy"
onclick='order(${JSON.stringify(x.g)},${JSON.stringify(p[0])},${p[1] === null ? "null" : p[1]})'
>
Заказать
</button>

</article>

`).join("")}

</div>

</section>

`).join("");

}


function setFilter(x){

filter = x;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function order(g,p,price){

selected = {
g,
p,
price
};

modal.classList.add("show");

document.getElementById("box").innerHTML = `

<div class="top">

<div>

<h2>Оформление заказа</h2>

<div class="selected">
${g} • ${p} • ${money(price)}
</div>

</div>

<button
class="close"
onclick="closeModal()"
>
×
</button>

</div>

<form id="form">

<div class="field">

<label>Ваше имя</label>

<input
id="name"
required
placeholder="Иван"
>

</div>

<div class="field">

<label>Telegram</label>

<input
id="tg"
required
placeholder="@username"
>

</div>

<button
class="submit"
type="submit"
>
Оформить заказ
</button>

</form>

`;

document.getElementById("form").onsubmit = submitOrder;

setTimeout(() => {

const nameInput = document.getElementById("name");

if(nameInput){
nameInput.focus();
}

},50);

}


async function submitOrder(e){

e.preventDefault();

const name =
document.getElementById("name").value.trim();

const tg =
document.getElementById("tg").value.trim();

if(!name || !tg){

alert("Заполните все поля.");

return;

}


const o = {

id: Date.now(),

date: new Date().toLocaleString("ru-RU"),

game: selected.g,

product: selected.p,

price: selected.price,

name,

telegram: tg

};


const submitButton =
document.querySelector(".submit");

if(submitButton){

submitButton.disabled = true;

submitButton.textContent = "Отправка...";

}


try{

const response = await fetch("/api/order",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(o)

});


let result;

try{

result = await response.json();

}catch(error){

result = {
ok:false,
error:"Сервер вернул неправильный ответ"
};

}


console.log("Ответ сервера:",result);


if(!response.ok || !result.ok){

console.error("Ошибка отправки:",result);

alert(
"Не удалось отправить заказ.\n\n" +
(result.error || "Неизвестная ошибка") +
(result.detail ? "\n\n" + result.detail : "")
);

if(submitButton){

submitButton.disabled = false;

submitButton.textContent = "Оформить заказ";

}

return;

}


/* Сохраняем заказ только после успешной отправки */

const orders =
JSON.parse(
localStorage.getItem("shop_orders") || "[]"
);

orders.unshift(o);

localStorage.setItem(
"shop_orders",
JSON.stringify(orders)
);


/* Успешный экран */

document.getElementById("box").innerHTML = `

<div class="success">

<div class="check">
✓
</div>

<h2>
Заказ оформлен!
</h2>

<p>
Наш менеджер скоро свяжется с вами.
</p>

<button
class="ok"
onclick="closeModal()"
>
Готово
</button>

</div>

`;


/* Вибрация Telegram */

if(
window.Telegram &&
Telegram.WebApp
){

try{

if(
Telegram.WebApp.HapticFeedback
){

Telegram.WebApp.HapticFeedback
.notificationOccurred("success");

}

}catch(err){}

}


}catch(error){

console.error(
"Ошибка соединения:",
error
);

alert(
"Не удалось отправить заказ.\n\n" +
"Проверьте подключение и попробуйте ещё раз."
);

if(submitButton){

submitButton.disabled = false;

submitButton.textContent =
"Оформить заказ";

}

}

}


function closeModal(){

modal.classList.remove("show");

}


modal.onclick = e => {

if(e.target === modal){

closeModal();

}

};


document.getElementById("cart").onclick = () => {

if(selected){

order(
selected.g,
selected.p,
selected.price
);

}else{

document.querySelector(".buy")?.click();

}

};


function esc(v){

return String(v)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


function showOrders(){

const a =
JSON.parse(
localStorage.getItem("shop_orders") || "[]"
);

const l =
document.getElementById("ordersList");


l.innerHTML = a.length

? a.map(o => `

<div class="order-item">

<strong>
${esc(o.game)} — ${esc(o.product)}
</strong>

<span>
💰 ${money(o.price)}
</span>

<span>
👤 ${esc(o.name)}
</span>

<span>
💬 ${esc(o.telegram)}
</span>

<span>
🕒 ${esc(o.date)}
</span>

</div>

`).join("")

: `
<div class="empty-orders">
Заявок пока нет.
</div>
`;

document
.getElementById("adminModal")
.classList.add("show");

}


let clicks = 0;
let timer;


document.getElementById("adminLogo").onclick = () => {

clicks++;

clearTimeout(timer);


if(clicks >= 5){

clicks = 0;

showOrders();

}else{

timer =
setTimeout(
() => clicks = 0,
1200
);

}

};


document.getElementById("adminClose").onclick = () => {

document
.getElementById("adminModal")
.classList
.remove("show");

};


document.getElementById("refreshOrders").onclick =
showOrders;


document.getElementById("clearOrders").onclick = () => {

if(
confirm(
"Удалить все заявки на этом устройстве?"
)
){

localStorage.removeItem("shop_orders");

showOrders();

}

};


document.getElementById("adminModal").onclick = e => {

if(e.target.id === "adminModal"){

e.currentTarget.classList.remove("show");

}

};


/* Запускаем каталог */

render();

</script>

</body>
</html>
